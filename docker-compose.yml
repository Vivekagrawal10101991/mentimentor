# Production Compose stack for mentimentor.com (single Ubuntu VM).
#
# Public ports: 80/443 on nginx only.
# Private (Compose network only): frontend, backend, postgres, redis.
#
# Local Postgres+Redis for host-run Spring Boot remains in docker-compose.dev.yml:
#   docker compose -f docker-compose.dev.yml up -d

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment when real TLS certificates exist (no fake certs):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - edge
    restart: unless-stopped
    mem_limit: 128m

  frontend:
    build:
      context: ./mentor-marketplace-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        # Prefer VITE_GOOGLE_CLIENT_ID; fall back to the backend GOOGLE_CLIENT_ID.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    expose:
      - "80"
    networks:
      - edge
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mentor_db}}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://mentimentor.com,https://www.mentimentor.com,http://mentimentor.com,http://www.mentimentor.com}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-mentor-marketplace}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      OTP_LOG_CODE: ${OTP_LOG_CODE:-false}
      ADMIN_BOOTSTRAP_PHONES: ${ADMIN_BOOTSTRAP_PHONES:-}
      ADMIN_PORTAL_SUPER_USERNAME: ${ADMIN_PORTAL_SUPER_USERNAME:-}
      ADMIN_PORTAL_SUPER_PASSWORD: ${ADMIN_PORTAL_SUPER_PASSWORD:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-20.0}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=60.0 -XX:+UseG1GC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentor_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host ports — reachable only on the Compose network as hostname "postgres".
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    # AOF persistence for OTP / availability keys across restarts; memory capped for the 4 GB VM.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    # No host ports — reachable only on the Compose network as hostname "redis".
    volumes:
      - redis_data:/data
    networks:
      - data
    restart: unless-stopped
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
