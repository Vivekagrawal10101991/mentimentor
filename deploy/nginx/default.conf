# Edge reverse proxy for the production Compose stack.
# HTTP only for now. Add TLS certificates and enable the HTTPS server block later
# (e.g. Certbot / Let's Encrypt). Do not place fake certificates here.

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8080;
}

# Redirect /api -> /api/ so proxy_pass stripping stays consistent.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    location = /api {
        return 301 /api/;
    }

    # Browser calls /api/... ; strip the prefix and forward to Spring Boot root paths.
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optional: expose Spring Boot health through the edge proxy (internal checks can hit backend directly).
    location = /healthz {
        proxy_pass http://backend_upstream/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React/Vite SPA (frontend container).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

