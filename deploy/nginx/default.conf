# Edge reverse proxy for the production Compose stack.
# TLS via Let's Encrypt certificates mounted from the host.

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8080;
}

# HTTP: ACME challenges + redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mentimentor.com www.mentimentor.com;

    # Let's Encrypt HTTP-01 challenge (Certbot webroot) — required for renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: API + SPA.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mentimentor.com www.mentimentor.com;

    ssl_certificate     /etc/letsencrypt/live/mentimentor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentimentor.com/privkey.pem;

    client_max_body_size 20m;

    location = /api {
        return 301 /api/;
    }

    # Browser calls /api/... ; strip the prefix and forward to Spring Boot root paths.
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optional: expose Spring Boot health through the edge proxy (internal checks can hit backend directly).
    location = /healthz {
        proxy_pass http://backend_upstream/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React/Vite SPA (frontend container).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
